# SPA fallback: react-router drives /login, /upload, /chat, /review, /usage
# client-side, so a hard refresh on any of those must serve index.html
# instead of returning nginx's 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
