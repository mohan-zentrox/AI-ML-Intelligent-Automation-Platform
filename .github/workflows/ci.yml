name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend lint + pytest (mock provider, in-memory vector store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      VECTOR_STORE_BACKEND: inmemory
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # requirements-optional.txt (chromadb/litellm) is deliberately not
      # installed - the tested path is LLM_PROVIDER=mock +
      # VECTOR_STORE_BACKEND=inmemory. Resolving it without installing still
      # catches a yanked or newly-conflicting pin, which is what broke this
      # job before (litellm==1.41.0 was removed from PyPI).
      - name: Check optional provider pins still resolve
        run: pip install --dry-run -r requirements.txt -r requirements-optional.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run pytest
        run: pytest -v --cov=app --cov-report=term-missing

      # TODO(FRD 9.3 - Evaluation & Quality Gates): once
      # backend/app/scaffold/promptfoo/promptfooconfig.yaml has real test
      # cases, add a required `promptfoo eval` step here so RAG groundedness
      # / citation / refusal regressions block merges, not just unit tests.

  frontend-lint-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so CI tests the exact dependency tree the
      # lockfile pins, and fails loudly if package.json and the lock disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Container build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: synapse-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: synapse-frontend:ci
          # Exercise the build arg, since this is the only way the deployed
          # bundle can be pointed at a non-localhost API.
          build-args: |
            VITE_API_BASE_URL=https://api.example.com/api/v1

  backend-boots:
    name: Backend actually starts (catches import cycles the suite hides)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: mock
      VECTOR_STORE_BACKEND: inmemory
      DATABASE_URL: "sqlite:///./ci_boot_check.db"
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest passing is not evidence that the app starts: conftest.py imports
      # app.db.base before app.main, which is exactly the ordering that hid a
      # circular import while all 86 tests were green.
      - name: Import the ASGI app as a first import
        run: python -c "import app.main"

      - name: Boot uvicorn and probe /health
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              curl -s http://127.0.0.1:8000/health
              echo
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy" >&2
          exit 1

      - name: Refuse to boot with the placeholder SECRET_KEY outside local
        env:
          ENVIRONMENT: production
          SECRET_KEY: dev-only-insecure-secret-change-me
        run: |
          if python -c "import app.main" 2>/dev/null; then
            echo "expected startup to fail with the placeholder SECRET_KEY" >&2
            exit 1
          fi
          echo "correctly refused the placeholder secret"

  migrations:
    name: Alembic upgrade + downgrade round-trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///./ci_migrations.db"
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Downgrades are the half that rots unnoticed, so assert the round trip
      # rather than only that `upgrade head` works on an empty database.
      - name: upgrade -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  pgvector-store:
    name: PgVectorStore against real Postgres + pgvector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The pgvector backend is pure SQL that only Postgres can run - the vector
    # type, the <=> cosine-distance operator, ON CONFLICT upsert, JSONB. There
    # is nothing useful to mock, so CI brings up a real server.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/synapse_test"
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pgvector suite
        run: pytest tests/test_pgvector_store.py -v

      # The Postgres path used to be entirely unexercised; a migration that
      # works on SQLite but not Postgres would otherwise reach production.
      - name: Alembic round-trip on Postgres
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/synapse_test"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
