description: "Project Synapse - grounded RAG regression eval (not yet active)"

providers:
  - id: http
    config:
      url: http://localhost:8000/api/v1/query
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{question}}"

prompts:
  - "{{question}}"

